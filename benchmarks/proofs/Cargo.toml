[package]
name = "seshat-proofs"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "seshat-proofs"
license = "MIT"

[dependencies]
oxc_allocator = "=0.148.0"
oxc_ast = "=0.148.0"
oxc_ast_visit = "=0.148.0"
oxc_parser = "=0.148.0"
oxc_span = "=0.148.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
glob = "=0.3.3"
signal-hook = { version = "=0.4.4", default-features = false }
libc = "=0.2.189"

[profile.release]
lto = "thin"
strip = "symbols"
