name: Linux ARM64 package proof

on:
  pull_request:
    paths:
      - .github/workflows/linux-arm64-package.yml
      - crates/seshat/**
      - benchmarks/proofs/**
      - packages/**
      - examples/**
      - packaging/**
      - docs/linux-arm64-package.md
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-arm64-package.yml
      - crates/seshat/**
      - benchmarks/proofs/**
      - packages/**
      - examples/**
      - packaging/**
      - docs/linux-arm64-package.md
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  package:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Set up Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup default 1.98.1
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-unknown-linux-gnu
      - name: Capture native preflight
        run: |
          mkdir -p work/arm64
          node benchmarks/proofs/linux-arm64-preflight.mjs --output work/arm64/preflight.json
      - name: Check proof failure reporting
        run: |
          node benchmarks/proofs/linux-arm64-summary.mjs --self-check
          node packaging/repeat-pack-failure-check.mjs
      - name: Fetch locked dependencies
        run: |
          npm ci --prefix benchmarks
          npm ci --prefix benchmarks/proofs
          cargo fetch --locked --manifest-path crates/seshat/Cargo.toml
      - name: Run native Rust tests
        run: |
          cargo test --locked --offline --manifest-path crates/seshat/Cargo.toml 2>&1 | tee work/arm64/rust-tests.log
      - name: Prove repeat ARM64 package reproducibility
        env:
          SESHAT_REPEAT_OUTPUT: work/arm64/repeat-pack.json
        run: |
          node packaging/repeat-pack.mjs --native-arm64 2>&1 | tee work/arm64/repeat-pack.log
      - name: Build native ARM64 package
        env:
          SESHAT_PACK_RESULT: work/arm64/package-result.json
        run: |
          node packaging/pack.mjs --native-arm64 2>&1 | tee work/arm64/pack.log
      - name: Stage release entry and native packages
        run: |
          mkdir -p work/arm64/release
          native_tarball="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/arm64/package-result.json")).tarball);')"
          native_binary="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/arm64/package-result.json")).binaryPath);')"
          tar -xOf "$native_tarball" package/BUILD.json > work/arm64/BUILD.json
          tar -xOf "$native_tarball" package/THIRD_PARTY_NOTICES.txt > work/arm64/THIRD_PARTY_NOTICES.txt
          node packaging/release.mjs \
            --output work/arm64/release \
            --binary linux-arm64="$native_binary" \
            --build-info linux-arm64=work/arm64/BUILD.json \
            --notices linux-arm64=work/arm64/THIRD_PARTY_NOTICES.txt \
            --manifest work/arm64/release.json 2>&1 | tee work/arm64/release.log
          entry_archive="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1])).entry.archive.file);' work/arm64/release.json)"
          native_archive="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1])).native.find(target => target.key === "linux-arm64").archive.file);' work/arm64/release.json)"
          cp "work/arm64/release/$entry_archive" work/arm64/seshat-entry.tgz
          cp "work/arm64/release/$native_archive" work/arm64/seshat-linux-arm64-release.tgz
      - name: Verify npm installation
        env:
          SESHAT_PROOF_OUTPUT: work/arm64/npm-package.json
          SESHAT_EXAMPLES_OUTPUT: work/arm64/public-consumer-examples.json
        run: |
          ENTRY_SHA256="$(sha256sum work/arm64/seshat-entry.tgz | cut -d' ' -f1)"
          NATIVE_SHA256="$(sha256sum work/arm64/seshat-linux-arm64-release.tgz | cut -d' ' -f1)"
          BINARY_SHA256="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/arm64/package-result.json")).binary);')"
          SESHAT_ENTRY_TARBALL_SHA256="$ENTRY_SHA256" SESHAT_NATIVE_TARBALL_SHA256="$NATIVE_SHA256" SESHAT_NATIVE_BINARY_SHA256="$BINARY_SHA256" node benchmarks/proofs/npm-package.mjs work/arm64/seshat-entry.tgz work/arm64/seshat-linux-arm64-release.tgz 2>&1 | tee work/arm64/npm-package.log
      - name: Verify standalone installation
        env:
          SESHAT_PROOF_OUTPUT: work/arm64/standalone.json
        run: |
          STANDALONE="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const result=JSON.parse(readFileSync("work/arm64/package-result.json")); console.log(result.standalone.path);')"
          cp "$STANDALONE" work/arm64/seshat-linux-arm64-standalone.tar.gz
          cmp work/arm64/seshat-linux-arm64.tgz work/arm64/seshat-linux-arm64-standalone.tar.gz
          PROOF_BINARY="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/arm64/package-result.json")).proofBinary);')"
          STANDALONE_SHA256="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/arm64/package-result.json")).standalone.sha256);')"
          BINARY_SHA256="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/arm64/package-result.json")).binary);')"
          SESHAT_PROOF_BINARY="$PROOF_BINARY" SESHAT_STANDALONE_SHA256="$STANDALONE_SHA256" SESHAT_BINARY_SHA256="$BINARY_SHA256" node benchmarks/proofs/standalone.mjs work/arm64/seshat-linux-arm64-standalone.tar.gz "$PROOF_BINARY" 2>&1 | tee work/arm64/standalone.log
      - name: Verify installed Jest/Expo runner
        env:
          SESHAT_PROOF_OUTPUT: work/arm64/jest-expo-check.json
        run: |
          node benchmarks/proofs/jest-expo-check.mjs \
            --tarball work/arm64/seshat-linux-arm64.tgz \
            --cases normal-1,assertion-kill,survivor,before-all \
            2>&1 | tee work/arm64/jest-expo-check.log
      - name: Verify installed Vitest runner
        env:
          SESHAT_PROOF_OUTPUT: work/arm64/vitest-check.json
        run: |
          node benchmarks/proofs/vitest-check.mjs \
            --tarball work/arm64/seshat-linux-arm64.tgz \
            --deps "$GITHUB_WORKSPACE/benchmarks/proofs" \
            --cases stack,assertion,survived,before-all \
            2>&1 | tee work/arm64/vitest-check.log
      - name: Verify native lifecycle
        env:
          SESHAT_DEBUG_CLEANUP: '1'
          SESHAT_PROOF_OUTPUT: work/arm64/lifecycle.json
        run: |
          PROOF_BINARY="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/arm64/package-result.json")).proofBinary);')"
          SESHAT_PROOF_BINARY="$PROOF_BINARY" node benchmarks/proofs/lifecycle.mjs 2>&1 | tee work/arm64/lifecycle.log
      - name: Write portable summary
        if: always()
        run: node benchmarks/proofs/linux-arm64-summary.mjs work/arm64
      - name: Upload package proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm64-package-proof
          path: |
            work/arm64
          if-no-files-found: error
