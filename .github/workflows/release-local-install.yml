name: Release local install

on:
  pull_request:
    paths:
      - .github/workflows/release-local-install.yml
      - benchmarks/proofs/release-local-archive-stager.mjs
      - examples/**
      - README.md
      - docs/configuration.md
      - docs/platform-support.md
      - docs/release-scope.md
      - docs/releases/**
      - docs/research/release-notice-audit.md
      - docs/research/release-notice-audit.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  local-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            platform: linux
            arch: x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            target: darwin-x64
            platform: darwin
            arch: x64
          - runner: macos-15
            target: darwin-arm64
            platform: darwin
            arch: arm64
          - runner: windows-2022
            target: win32-x64
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Check host runtime
        env:
          SESHAT_PLATFORM: ${{ matrix.platform }}
          SESHAT_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "work/release-local-install/${{ matrix.target }}"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';

          assert.equal(process.version, 'v24.20.0');
          const npm = process.platform === 'win32' ? ['npm.cmd', {shell: true}] : ['npm', {}];
          assert.equal(execFileSync(npm[0], ['--version'], {encoding: 'utf8', ...npm[1]}).trim(), '11.19.0');
          assert.equal(process.platform, process.env.SESHAT_PLATFORM);
          assert.equal(process.arch, process.env.SESHAT_ARCH);
          NODE
      - name: Download and stage candidate archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "work/release-local-install/${{ matrix.target }}"
          node benchmarks/proofs/release-local-archive-stager.mjs \
            --manifest docs/research/release-notice-audit.json \
            --target "${{ matrix.target }}" \
            --output "work/release-local-install/${{ matrix.target }}/archives" \
            --evidence "work/release-local-install/${{ matrix.target }}/archive-staging.json"
      - name: Run documented six archive installation
        run: |
          node examples/verify.mjs \
            --archives "work/release-local-install/${{ matrix.target }}/archives" \
            --output "work/release-local-install/${{ matrix.target }}/verifier.json" \
            2>&1 | tee "work/release-local-install/${{ matrix.target }}/verifier.log"
      - name: Check installed archive identity
        env:
          SESHAT_TARGET: ${{ matrix.target }}
          SESHAT_PLATFORM: ${{ matrix.platform }}
          SESHAT_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';

          const target = process.env.SESHAT_TARGET;
          const manifest = JSON.parse(readFileSync('docs/research/release-notice-audit.json', 'utf8'));
          const staging = JSON.parse(readFileSync(`work/release-local-install/${target}/archive-staging.json`, 'utf8'));
          const verifier = JSON.parse(readFileSync(`work/release-local-install/${target}/verifier.json`, 'utf8'));
          const coordinate = manifest.coordinates.find(value => value.target === target);
          assert.ok(coordinate, `missing manifest coordinate: ${target}`);
          assert.equal(staging.validation?.passed, true, 'archive staging did not pass');
          assert.equal(verifier.validation?.passed, true, 'local install verification did not pass');
          assert.deepEqual(verifier.installed?.host, {
            platform: process.env.SESHAT_PLATFORM,
            arch: process.env.SESHAT_ARCH,
          });
          assert.equal(verifier.installed.native.package, coordinate.package);
          assert.equal(verifier.installed.native.sha256, coordinate.buildProvenance.binary.sha256);
          assert.equal(verifier.installed.native.bytes, coordinate.buildProvenance.binary.bytes);
          console.log(`Verified installed ${target} native identity against candidate provenance.`);
          NODE
      - name: Upload local install evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-local-install-${{ matrix.target }}
          path: work/release-local-install/${{ matrix.target }}
          if-no-files-found: error
