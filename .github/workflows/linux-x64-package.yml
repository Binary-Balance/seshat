name: Linux x64 package proof

on:
  pull_request:
    paths:
      - .github/workflows/linux-x64-package.yml
      - benchmarks/proofs/**
      - packaging/**
      - docs/linux-x64-package.md
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-x64-package.yml
      - benchmarks/proofs/**
      - packaging/**
      - docs/linux-x64-package.md
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Set up Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup default 1.98.1
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu
      - name: Capture native preflight
        run: |
          set -euo pipefail
          mkdir -p work/x64
          node benchmarks/proofs/linux-x64-preflight.mjs --output work/x64/preflight.json
      - name: Check proof failure reporting
        run: |
          set -euo pipefail
          node benchmarks/proofs/linux-x64-preflight.mjs --self-check
          node benchmarks/proofs/linux-x64-summary.mjs --self-check
      - name: Fetch locked dependencies
        run: |
          set -euo pipefail
          npm ci --prefix benchmarks
          npm ci --prefix benchmarks/proofs
          cargo fetch --locked --manifest-path benchmarks/proofs/Cargo.toml
      - name: Run native Rust tests
        run: |
          set -euo pipefail
          cargo test --locked --offline --manifest-path benchmarks/proofs/Cargo.toml 2>&1 | tee work/x64/rust-tests.log
      - name: Fetch pinned Debian 11 proof inputs
        run: |
          set -euo pipefail
          mkdir -p work/x64/debian11-inputs
          curl --max-time 120 -fSL https://raw.githubusercontent.com/debuerreotype/docker-debian-artifacts/bae6d64d90b4068b09ff9d8b564c2773ef5d8d83/bullseye/oci/blobs/rootfs.tar.gz \
            -o work/x64/debian11-inputs/rootfs.tar.gz
          curl --max-time 120 -fSL https://nodejs.org/dist/v24.20.0/node-v24.20.0-linux-x64.tar.xz \
            -o work/x64/debian11-inputs/node.tar.xz
          curl --max-time 60 -fSL https://deb.debian.org/debian/pool/main/g/glibc/libc6_2.31-13+deb11u11_amd64.deb \
            -o work/x64/debian11-inputs/libc6.deb
          curl --max-time 60 -fSL https://deb.debian.org/debian/pool/main/g/glibc/libc6-dev_2.31-13+deb11u11_amd64.deb \
            -o work/x64/debian11-inputs/libc6-dev.deb
          curl --max-time 60 -fSL https://deb.debian.org/debian/pool/main/g/gcc-10/libgcc-s1_10.2.1-6_amd64.deb \
            -o work/x64/debian11-inputs/libgcc-s1.deb
      - name: Prove repeat x64 package reproducibility
        env:
          SESHAT_REPEAT_OUTPUT: work/x64/repeat-pack.json
        run: |
          set -euo pipefail
          node packaging/repeat-pack.mjs work/x64/debian11-inputs 2>&1 | tee work/x64/repeat-pack.log
      - name: Build x64 package against Debian 11 libraries
        env:
          SESHAT_PACK_RESULT: work/x64/package-result.json
        run: |
          set -euo pipefail
          node packaging/pack.mjs work/x64/debian11-inputs 2>&1 | tee work/x64/pack.log
      - name: Retain npm payload for both installation routes
        run: |
          set -euo pipefail
          tarball="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/x64/package-result.json")).tarball);')"
          standalone="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/x64/package-result.json")).standalone.path);')"
          cp "$tarball" work/x64/seshat-linux-x64.tgz
          cp "$standalone" work/x64/seshat-linux-x64-standalone.tar.gz
          cmp work/x64/seshat-linux-x64.tgz work/x64/seshat-linux-x64-standalone.tar.gz
          test "$(sha256sum work/x64/seshat-linux-x64.tgz | cut -d' ' -f1)" = \
            "$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const result=JSON.parse(readFileSync("work/x64/package-result.json")); console.log(result.tarballSha256);')"
          test "$(sha256sum work/x64/seshat-linux-x64-standalone.tar.gz | cut -d' ' -f1)" = \
            "$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const result=JSON.parse(readFileSync("work/x64/package-result.json")); console.log(result.standalone.sha256);')"
      - name: Verify native npm installation
        env:
          SESHAT_PROOF_OUTPUT: work/x64/npm-package.json
        run: |
          set -euo pipefail
          proof_binary="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/x64/package-result.json")).proofBinary);')"
          tarball_sha256="$(sha256sum work/x64/seshat-linux-x64.tgz | cut -d' ' -f1)"
          binary_sha256="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/x64/package-result.json")).binary);')"
          SESHAT_PROOF_BINARY="$proof_binary" SESHAT_TARBALL_SHA256="$tarball_sha256" SESHAT_BINARY_SHA256="$binary_sha256" \
            node benchmarks/proofs/npm-package.mjs work/x64/seshat-linux-x64.tgz 2>&1 | tee work/x64/npm-package.log
      - name: Verify native standalone installation
        env:
          SESHAT_PROOF_OUTPUT: work/x64/standalone.json
        run: |
          set -euo pipefail
          proof_binary="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/x64/package-result.json")).proofBinary);')"
          standalone_sha256="$(sha256sum work/x64/seshat-linux-x64-standalone.tar.gz | cut -d' ' -f1)"
          binary_sha256="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/x64/package-result.json")).binary);')"
          SESHAT_PROOF_BINARY="$proof_binary" SESHAT_STANDALONE_SHA256="$standalone_sha256" SESHAT_BINARY_SHA256="$binary_sha256" \
            node benchmarks/proofs/standalone.mjs work/x64/seshat-linux-x64-standalone.tar.gz "$proof_binary" 2>&1 | tee work/x64/standalone.log
      - name: Verify installed Jest/Expo runner
        env:
          SESHAT_PROOF_OUTPUT: work/x64/jest-expo-check.json
        run: |
          set -euo pipefail
          node benchmarks/proofs/jest-expo-check.mjs \
            --tarball work/x64/seshat-linux-x64.tgz \
            --cases normal-1,assertion-kill,survivor,before-all \
            2>&1 | tee work/x64/jest-expo-check.log
      - name: Verify installed Vitest runner
        env:
          SESHAT_PROOF_OUTPUT: work/x64/vitest-check.json
        run: |
          set -euo pipefail
          node benchmarks/proofs/vitest-check.mjs \
            --tarball work/x64/seshat-linux-x64.tgz \
            --deps "$GITHUB_WORKSPACE/benchmarks/proofs" \
            --cases stack,assertion,survived,before-all \
            2>&1 | tee work/x64/vitest-check.log
      - name: Verify native lifecycle
        env:
          SESHAT_DEBUG_CLEANUP: '1'
          SESHAT_PROOF_OUTPUT: work/x64/lifecycle.json
        run: |
          set -euo pipefail
          proof_binary="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync("work/x64/package-result.json")).proofBinary);')"
          SESHAT_PROOF_BINARY="$proof_binary" node benchmarks/proofs/lifecycle.mjs 2>&1 | tee work/x64/lifecycle.log
      - name: Install Bubblewrap for Debian proof
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap
          bwrap --version
      - name: Verify Debian 11 minimum userspace
        env:
          SESHAT_DEBIAN_OUTPUT: work/x64/debian11.json
        run: |
          set -euo pipefail
          node benchmarks/proofs/linux-debian.mjs \
            work/x64/debian11-inputs work/x64/package-result.json work/x64/seshat-linux-x64-standalone.tar.gz \
            2>&1 | tee work/x64/debian11.log
      - name: Write portable summary
        if: always()
        run: |
          set -euo pipefail
          mkdir -p work/x64
          node benchmarks/proofs/linux-x64-summary.mjs work/x64
      - name: Upload package proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64-package-proof
          path: |
            work/x64/preflight.json
            work/x64/package-result.json
            work/x64/seshat-linux-x64.tgz
            work/x64/seshat-linux-x64-standalone.tar.gz
            work/x64/npm-package.json
            work/x64/npm-package.log
            work/x64/standalone.json
            work/x64/standalone.log
            work/x64/jest-expo-check.json
            work/x64/jest-expo-check.log
            work/x64/vitest-check.json
            work/x64/vitest-check.log
            work/x64/lifecycle.json
            work/x64/lifecycle.log
            work/x64/debian11.json
            work/x64/debian11.log
            work/x64/rust-tests.log
            work/x64/repeat-pack.json
            work/x64/repeat-pack.log
            work/x64/pack.log
            work/x64/summary.json
          if-no-files-found: error
