name: Windows runtime and shared fixture proof

on:
  pull_request:
    paths:
      - .github/workflows/windows-runtime.yml
      - crates/seshat/Cargo.toml
      - crates/seshat/Cargo.lock
      - crates/seshat/src/**
      - crates/seshat/tests/**
      - benchmarks/proofs/windows-runtime-preflight.mjs
      - benchmarks/proofs/windows-runtime-cli.mjs
      - benchmarks/proofs/cli.mjs
      - benchmarks/proofs/parallel.mjs
      - benchmarks/proofs/process.mjs
      - benchmarks/proofs/jest-expo-check.mjs
      - benchmarks/proofs/jest-*.cjs
      - benchmarks/proofs/vitest-*.mjs
      - benchmarks/proofs/fixtures/**
      - benchmarks/proofs/liveness.mjs
      - benchmarks/proofs/collect-node.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-runtime.yml
      - crates/seshat/Cargo.toml
      - crates/seshat/Cargo.lock
      - crates/seshat/src/**
      - crates/seshat/tests/**
      - benchmarks/proofs/windows-runtime-preflight.mjs
      - benchmarks/proofs/windows-runtime-cli.mjs
      - benchmarks/proofs/cli.mjs
      - benchmarks/proofs/parallel.mjs
      - benchmarks/proofs/process.mjs
      - benchmarks/proofs/jest-expo-check.mjs
      - benchmarks/proofs/jest-*.cjs
      - benchmarks/proofs/vitest-*.mjs
      - benchmarks/proofs/fixtures/**
      - benchmarks/proofs/liveness.mjs
      - benchmarks/proofs/collect-node.mjs
  workflow_dispatch:

# Supersede older PR checks; keep each push and manual evidence run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: crates/seshat/target
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Set up Rust 1.98.1
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.1-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo -V
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run environment preflight
        shell: pwsh
        run: |
          node benchmarks/proofs/windows-runtime-preflight.mjs --output windows-runtime-preflight.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-runtime-preflight
          path: windows-runtime-preflight.json
          if-no-files-found: error
      - name: Install locked JavaScript dependencies
        id: dependencies
        shell: pwsh
        run: |
          npm ci --prefix benchmarks --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix benchmarks/proofs --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix benchmarks/proofs/fixtures/jest-expo --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch locked Rust dependencies
        shell: pwsh
        run: |
          cargo fetch --locked --manifest-path crates/seshat/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build complete CLI binaries
        id: build
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path crates/seshat/Cargo.toml --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check console helper ownership and failures
        shell: pwsh
        env:
          SESHAT_CONSOLE_HELPER_BINARY: ${{ github.workspace }}\crates\seshat\target\release\windows-console-helper.exe
        run: |
          New-Item -ItemType Directory -Force work/windows | Out-Null
          cargo test --locked --manifest-path crates/seshat/Cargo.toml --bin windows-console-helper -- --ignored --skip windows::tests::fixture --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath work/windows/console-helper.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Rust tests
        shell: pwsh
        run: |
          cargo test --locked --manifest-path crates/seshat/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check CLI entry points
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\crates\seshat\target\release\seshat.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Join-Path $env:RUNNER_TEMP 'seshat-runtime-subject.ts'
          Set-Content -Path $source -Value 'export const value = (input: number) => input >= 0;' -NoNewline
          & "$env:GITHUB_WORKSPACE\crates\seshat\target\release\seshat-proofs.exe" inspect $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native CLI proof
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:SESHAT_CONSOLE_HELPER_BINARY = "$env:GITHUB_WORKSPACE\crates\seshat\target\release\windows-console-helper.exe"
          $env:SESHAT_WINDOWS_EVIDENCE_PATH = "$env:GITHUB_WORKSPACE\windows-runtime-cli-evidence.json"
          node benchmarks/proofs/windows-runtime-cli.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native CLI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-runtime-cli-evidence
          path: windows-runtime-cli-evidence.json
          if-no-files-found: error
      - name: Run shared CLI fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.build.outcome == 'success' }}
        shell: pwsh
        env:
          SESHAT_CLI_BINARY: ${{ github.workspace }}\crates\seshat\target\release\seshat.exe
          SESHAT_PROOF_BINARY: ${{ github.workspace }}\crates\seshat\target\release\seshat-proofs.exe
          SESHAT_CONSOLE_HELPER_BINARY: ${{ github.workspace }}\crates\seshat\target\release\windows-console-helper.exe
          SESHAT_PROOF_OUTPUT: ${{ github.workspace }}\work\windows\shared-cli.json
        run: |
          New-Item -ItemType Directory -Force work/windows | Out-Null
          node benchmarks/proofs/cli.mjs 2>&1 | Tee-Object -FilePath work/windows/shared-cli.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run shared parallel fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.build.outcome == 'success' }}
        shell: pwsh
        env:
          SESHAT_CLI_BINARY: ${{ github.workspace }}\crates\seshat\target\release\seshat.exe
          SESHAT_CONSOLE_HELPER_BINARY: ${{ github.workspace }}\crates\seshat\target\release\windows-console-helper.exe
          SESHAT_PARALLEL_CLI: '1'
          SESHAT_PROOF_OUTPUT: ${{ github.workspace }}\work\windows\shared-parallel.json
        run: |
          New-Item -ItemType Directory -Force work/windows | Out-Null
          node benchmarks/proofs/parallel.mjs 2>&1 | Tee-Object -FilePath work/windows/shared-parallel.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run built-executable Jest/Expo controls
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.build.outcome == 'success' }}
        shell: pwsh
        env:
          SESHAT_PROOF_OUTPUT: ${{ github.workspace }}\work\windows\jest-expo-check.json
        run: |
          New-Item -ItemType Directory -Force work/windows | Out-Null
          node benchmarks/proofs/jest-expo-check.mjs `
            --cli "$env:GITHUB_WORKSPACE\crates\seshat\target\release\seshat.exe" `
            --deps "$env:GITHUB_WORKSPACE\benchmarks\proofs\fixtures\jest-expo" `
            --cases normal-1,assertion-kill,survivor,before-all 2>&1 | Tee-Object -FilePath work/windows/jest-expo-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run built-executable Vitest controls
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.build.outcome == 'success' }}
        shell: pwsh
        env:
          SESHAT_PROOF_OUTPUT: ${{ github.workspace }}\work\windows\vitest-check.json
        run: |
          New-Item -ItemType Directory -Force work/windows | Out-Null
          node benchmarks/proofs/vitest-check.mjs `
            --cli "$env:GITHUB_WORKSPACE\crates\seshat\target\release\seshat.exe" `
            --deps "$env:GITHUB_WORKSPACE\benchmarks\proofs" `
            --cases stack,assertion,survived,before-all 2>&1 | Tee-Object -FilePath work/windows/vitest-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require shared fixture reports
        shell: pwsh
        run: |
          foreach ($report in @('shared-cli.json', 'shared-parallel.json', 'jest-expo-check.json', 'vitest-check.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path work/windows $report) -PathType Leaf)) {
              throw "expected fixture report is missing: $report"
            }
          }
      - name: Upload shared fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-shared-fixture-evidence
          path: |
            work/windows/console-helper.log
            work/windows/shared-cli.json
            work/windows/shared-cli.log
            work/windows/shared-parallel.json
            work/windows/shared-parallel.log
            work/windows/jest-expo-check.json
            work/windows/jest-expo-check.log
            work/windows/vitest-check.json
            work/windows/vitest-check.log
          if-no-files-found: error
