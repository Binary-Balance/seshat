name: Linux ARM64 preflight

on:
  pull_request:
    paths:
      - .github/workflows/linux-arm64-preflight.yml
      - benchmarks/proofs/linux-arm64-preflight.mjs
      - docs/linux-arm64-preflight.md
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-arm64-preflight.yml
      - benchmarks/proofs/linux-arm64-preflight.mjs
      - docs/linux-arm64-preflight.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Run environment preflight
        run: node benchmarks/proofs/linux-arm64-preflight.mjs --output linux-arm64-preflight.json
      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm64-preflight
          path: linux-arm64-preflight.json
          if-no-files-found: error
